<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Производственный план — рубашки</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%94%3C/text%3E%3C/svg%3E" />
  <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('planner-theme') || 'light'); } catch (e) {}</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🧵 Производственный план</div>
    <nav class="tabs">
      <button class="tab active" data-tab="gantt">Диаграмма Ганта</button>
      <button class="tab" data-tab="matrix">План по размерам</button>
      <button class="tab" data-tab="salesplan">План продаж</button>
      <button class="tab" data-tab="fact">Факт</button>
      <button class="tab" data-tab="timing">Контроль сроков</button>
      <button class="tab" data-tab="fabric">Заказ ткани</button>
      <button class="tab" data-tab="dashboard">Дашборд</button>
      <button class="tab" data-tab="season">Ранг сезонности</button>
      <button class="tab" data-tab="supply">Остатки и поставки</button>
      <button class="tab" data-tab="unit">Юнит-экономика</button>
      <button class="tab" data-tab="data">Данные</button>
    </nav>
    <div class="actions">
      <label class="season-pick">Сезон: <select id="season-filter"></select></label>
      <span id="status" class="status"></span>
      <button id="btn-settings" class="btn btn-icon" title="Настройки: токен MPStats">⚙</button>
      <button id="btn-theme" class="btn btn-icon" title="Светлая / тёмная тема">🌙</button>
      <button id="btn-recalc" class="btn">Пересчитать</button>
      <button id="btn-save" class="btn btn-primary">Сохранить</button>
    </div>
  </header>

  <main>
    <!-- ГАНТ -->
    <section id="view-gantt" class="view active">
      <div class="toolbar">
        <label>Масштаб:
          <input type="range" id="zoom" min="6" max="40" value="14" />
        </label>
        <label title="Точка отсчёта расписания — с этой даты планируется производство. Пусто = как раньше (ранний месяц этапов / сегодня).">Старт производства:
          <input type="date" id="prod-start" />
          <button id="prod-start-clear" class="btn btn-icon" title="Сбросить (авто)">✕</button>
        </label>
        <!-- btn-jit временно скрыт: движок «Экономная раскладка» переделывается на непрерывные сезонные блоки (без пинов дат). -->
        <button id="btn-compact" class="btn" title="Сохранить вашу раскладку (цех + порядок блоков), но убрать лишние разрывы в днях — блоки встают встык друг за другом.">🧲 Уплотнить</button>
        <button id="btn-snapshot" class="btn" title="Выгрузить слепок текущей раскладки в Excel — по каждому артикулу, цвету и партии: цех, даты, приход/дедлайн ВБ, насколько рано товар готов. Для анализа экономной (JIT) раскладки.">⤓ Слепок раскладки</button>
        <button id="btn-clear-pins" class="btn btn-subtle" title="Снять все ручные закрепления блоков (цех/дата) и вернуться к авто-раскладке планировщика.">↺ Сбросить раскладку</button>
        <span class="legend">
          <i class="mark deadline"></i>Дедлайн WB · блок = этап (крой→ОТК) · ⏱ отставание
        </span>
        <span class="hint">Наведи — сводка. Двойной клик — детали. Тяни блок: по горизонтали — дата, по вертикали — другой цех (одним движением).</span>
      </div>
      <div id="gantt" class="gantt-wrap"></div>
    </section>

    <!-- ПЛАН ПО РАЗМЕРАМ (матрица размер×цвет) -->
    <section id="view-matrix" class="view">
      <div id="matrix"></div>
    </section>

    <!-- ПЛАН ПРОДАЖ (сводка с выбором артикулов и этапов) -->
    <section id="view-salesplan" class="view">
      <div id="salesplan"></div>
    </section>

    <!-- ФАКТ (фактические количества по партиям) -->
    <section id="view-fact" class="view">
      <div id="fact"></div>
    </section>

    <!-- КОНТРОЛЬ СРОКОВ (факт по операциям + отставание) -->
    <section id="view-timing" class="view">
      <div id="timing"></div>
    </section>

    <!-- ЗАКАЗ ТКАНИ (консолидированный по этапу) -->
    <section id="view-fabric" class="view">
      <div id="fabric"></div>
    </section>

    <!-- ДАШБОРД -->
    <section id="view-dashboard" class="view">
      <div id="dashboard"></div>
    </section>

    <!-- РАНГ СЕЗОННОСТИ (план продаж по сезонности) -->
    <section id="view-unit" class="view">
      <div id="unit"></div>
    </section>

    <section id="view-season" class="view">
      <div id="season"></div>
    </section>

    <!-- ОСТАТКИ И ПОСТАВКИ -->
    <section id="view-supply" class="view">
      <div id="supply"></div>
    </section>

    <!-- ДАННЫЕ -->
    <section id="view-data" class="view">
      <div id="data-forms"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <div id="settings-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-head"><h3>⚙ Настройки — токен MPStats</h3><button id="settings-close" class="btn btn-icon" title="Закрыть">✕</button></div>
      <div id="settings-body"><div class="mini">Загрузка…</div></div>
    </div>
  </div>
  <button id="scroll-top" class="scroll-top" title="Наверх" aria-label="Прокрутить наверх">↑</button>
  <script src="vendor/xlsx-js-style.min.js"></script>
  <script type="module" src="app.js"></script>
  <!-- Пользовательский чип (имя, админка, выход) — только при включённой авторизации. -->
  <script>
    (function () {
      fetch('/api/me', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
        if (!d || !d.authEnabled || !d.user) return;
        var actions = document.querySelector('.topbar .actions');
        if (!actions) return;
        var u = d.user;
        var wrap = document.createElement('span');
        wrap.className = 'user-chip';
        wrap.style.cssText = 'display:inline-flex;align-items:center;gap:6px;margin-left:6px;font-size:13px;white-space:nowrap';
        var who = (u.name || ('@' + (u.username || u.telegramId)));
        wrap.innerHTML =
          (u.photoUrl ? '<img src="' + u.photoUrl + '" alt="" style="width:22px;height:22px;border-radius:50%">' : '👤') +
          '<span title="Telegram-ID: ' + u.telegramId + '">' + who.replace(/[<>&]/g, '') + '</span>' +
          (u.isAdmin ? ' <a href="/admin" class="btn btn-icon" title="Управление доступом" style="text-decoration:none">🔑</a>' : '') +
          ' <button id="btn-logout" class="btn btn-icon" title="Выйти">⎋</button>';
        actions.appendChild(wrap);
        var lo = document.getElementById('btn-logout');
        if (lo) lo.addEventListener('click', function () {
          fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' }).then(function () { location.replace('/login'); });
        });
      }).catch(function () {});
    })();
  </script>
</body>
</html>
